name: Deploy to GitHub Pages

# 演示站随 main 自动发布（仓库名不是 <user>.github.io，Pages 挂在 /<仓库名>/ 子路径）。
# 站点根路径由 src/config.ts 的 basePath 决定，astro.config.ts 的 base 取同一个值，
# 站内绝对路径一律经 abs() 补前缀——两处必须同步改，否则资源全 404。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (astro + pagefind)
        run: npm run build
      # 部署本体：Pages 走官方工件模式
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # CDN 镜像：把 dist 推到 cdn 分支，供 jsdelivr gh/<repo>@cdn 分发静态资源
      # （jsdelivr 镜像的是分支文件，工件模式的产物不在任何分支上，必须单独推）
      - name: Push dist to cdn branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: cdn
          force_orphan: true
          keep_files: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

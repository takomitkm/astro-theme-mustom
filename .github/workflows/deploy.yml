name: Deploy to GitHub Pages

# 本仓库是主题源码，不是线上站点。线上站点由 takomitkm/takomitkm.github.io 部署，
# 所以这里默认不随 push 自动跑：Pages 未在仓库设置里启用时，
# actions/deploy-pages 必然 404（Failed to create deployment），每次提交都挂红。
#
# 要把本仓库当演示站发布，需要先做两件事，再把 push 触发器加回来：
#   1. Settings → Pages → Source 选 "GitHub Actions"（否则 deploy 步骤 404）
#   2. 把 src/config.ts 的 site.url 改成 https://takomitkm.github.io/astro-theme-mustom
#      并把 cdnPrefix 改成 .../gh/takomitkm/astro-theme-mustom@cdn，
#      否则 canonical / OG / sitemap / CDN 资源仍指向旧站点
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (astro + pagefind)
        run: npm run build
      # 部署本体：Pages 走官方工件模式
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # CDN 镜像：把 dist 推到 cdn 分支，供 jsdelivr gh/<repo>@cdn 分发静态资源
      # （jsdelivr 镜像的是分支文件，工件模式的产物不在任何分支上，必须单独推）
      - name: Push dist to cdn branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: cdn
          force_orphan: true
          keep_files: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
